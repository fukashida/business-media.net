            </div>

            <div class="case-carousel__controls">

                        type="button" aria-label="前の体験談"
                        aria-controls="case-track">‹</button>

                <div class="case-carousel__dots" aria-label="体験談の切り替え">

                            aria-controls="case-track"></button>

                            aria-label="体験談2を表示"
                            aria-controls="case-track"></button>
                    <button type="button" class="case-carousel__dot"
                            aria-label="体験談3を表示"
                            aria-controls="case-track"></button>
                </div>

                <button class="case-carousel__arrow case-carousel__next"
                        type="button" aria-label="次の体験談"
                        aria-controls="case-track">›</button>

<script>
document.querySelectorAll(".case-carousel").forEach((carousel) => {
    const track = carousel.querySelector(".case-carousel__track");
    const slides = [...track.children];
    const dots = [...carousel.querySelectorAll(".case-carousel__dot")];
    const reducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
    );

    let current = 0;
    let frame = null;
    let autoSlide = null;
    const interval = 5000; // 5秒ごと

    function updateDots() {
        dots.forEach((dot, index) => {
            if (index === current) {
                dot.setAttribute("aria-current", "true");
            } else {
                dot.removeAttribute("aria-current");
            }
        });
    }

    function goTo(index) {
        current = (index + slides.length) % slides.length;

        track.scrollTo({
            left: slides[current].offsetLeft - slides[0].offsetLeft,
            behavior: reducedMotion.matches ? "instant" : "smooth"
        });

        updateDots();
    }

    // 自動再生
    function startAutoSlide() {
        stopAutoSlide();

        if (slides.length <= 1) return;

        autoSlide = setInterval(() => {
            goTo(current + 1);
        }, interval);
    }

    // 自動再生停止
    function stopAutoSlide() {
        if (autoSlide !== null) {
            clearInterval(autoSlide);
            autoSlide = null;
        }
    }

    // 手動操作したら5秒後から再カウント
    function manualGoTo(index) {
        goTo(index);
        startAutoSlide();
    }

    carousel.querySelector(".case-carousel__prev")
        .addEventListener("click", () => manualGoTo(current - 1));

    carousel.querySelector(".case-carousel__next")
        .addEventListener("click", () => manualGoTo(current + 1));

    dots.forEach((dot, index) => {
        dot.addEventListener("click", () => manualGoTo(index));
    });

    // スワイプ対応
    track.addEventListener("scroll", () => {
        if (frame !== null) return;

        frame = requestAnimationFrame(() => {
            const positions = slides.map(
                slide => slide.offsetLeft - slides[0].offsetLeft
            );

            const distances = positions.map(
                position => Math.abs(track.scrollLeft - position)
            );

            current = distances.indexOf(Math.min(...distances));
            updateDots();
            frame = null;
        });
    }, { passive: true });

    // スワイプ操作後にタイマーをリセット
    track.addEventListener("pointerdown", stopAutoSlide);
    track.addEventListener("pointerup", startAutoSlide);
    track.addEventListener("pointercancel", startAutoSlide);

    // キーボード操作
    track.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight") {
            event.preventDefault();
            manualGoTo(current + 1);
        } else if (event.key === "ArrowLeft") {
            event.preventDefault();
            manualGoTo(current - 1);
        }
    });

    // 画面幅変更時の位置調整
    new ResizeObserver(() => {
        track.scrollTo({
            left: slides[current].offsetLeft - slides[0].offsetLeft,
            behavior: "instant"
        });
    }).observe(track);

    // ブラウザのタブが非表示なら停止
    document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
            stopAutoSlide();
        } else {
            startAutoSlide();
        }
    });

    // 自動再生開始
    startAutoSlide();
});
</script>

</body>
